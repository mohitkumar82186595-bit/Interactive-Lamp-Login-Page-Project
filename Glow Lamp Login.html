<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lamp Login Animation</title>
<style>
  /* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #0e0f12;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse 230px 170px at 29% 52%,
            rgba(255, 220, 130, 0.055),
            transparent 72%
        ),
        #0e0f12;

    border: 1px solid rgba(150, 150, 150, 0.35);
}


/* =========================================================
   LAMP LIGHT
========================================================= */

.ambient-light {
    position: absolute;

    left: 29%;
    top: 48%;

    width: 250px;
    height: 220px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255, 225, 145, 0.20) 0%,
            rgba(255, 220, 135, 0.12) 22%,
            rgba(255, 215, 125, 0.055) 43%,
            transparent 72%
        );

    filter: blur(18px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.7s ease,
        transform 0.8s ease;
}

body.lamp-on .ambient-light {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1.08);
}


/* =========================================================
   LAMP CONTAINER
========================================================= */

.lamp-container {
    position: absolute;

    left: 29.2%;
    top: 53.5%;

    width: 115px;
    height: 155px;

    transform: translate(-50%, -50%);

    z-index: 10;
}


/* =========================================================
   LAMP BODY
========================================================= */

.lamp {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100px;
    height: 150px;

    transform: translate(-50%, -50%);
}


/* =========================================================
   LAMP SHADE
========================================================= */

.lamp-shade {
    position: absolute;

    left: 50%;
    top: 5px;

    width: 94px;
    height: 37px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            #fffef7 0%,
            #f8f6eb 60%,
            #e8e5d9 100%
        );

    border-radius:
        50% 50% 45% 45% /
        75% 75% 32% 32%;

    box-shadow:
        0 0 3px rgba(255, 255, 255, 0.9);

    transition:
        filter 0.5s ease,
        box-shadow 0.5s ease;

    z-index: 3;
}


/* =========================================================
   LAMP SHADE INNER EDGE
========================================================= */

.shade-highlight {
    position: absolute;

    left: 7px;
    right: 7px;

    bottom: 1px;

    height: 6px;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.62);
}


/* =========================================================
   LAMP ON GLOW
========================================================= */

body.lamp-on .lamp-shade {
    filter: brightness(1.05);

    box-shadow:
        0 0 5px rgba(255, 255, 255, 0.95),
        0 0 16px rgba(255, 225, 145, 0.75),
        0 0 35px rgba(255, 215, 125, 0.42),
        0 0 60px rgba(255, 210, 110, 0.18);
}


/* =========================================================
   LAMP STEM
========================================================= */

.lamp-stem {
    position: absolute;

    left: 50%;
    top: 39px;

    width: 8px;
    height: 91px;

    transform: translateX(-50%);

    border-radius: 5px;

    background:
        linear-gradient(
            to right,
            #ceccc4 0%,
            #faf8ef 45%,
            #dedbd1 70%,
            #c2c0b8 100%
        );

    box-shadow:
        0 0 2px rgba(255, 255, 255, 0.3);
}


/* =========================================================
   LAMP BASE
========================================================= */

.lamp-base {
    position: absolute;

    left: 50%;
    bottom: 11px;

    width: 55px;
    height: 8px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #f8f6eb,
            #d1cec4
        );

    box-shadow:
        0 1px 2px rgba(255, 255, 255, 0.2);
}


/* =========================================================
   PULL CHAIN
========================================================= */

.pull-chain {
    position: absolute;

    left: 76px;
    top: 38px;

    width: 30px;
    height: 88px;

    padding: 0;

    border: 0;

    outline: none;

    background: transparent;

    cursor: pointer;

    z-index: 30;
}


/* =========================================================
   CHAIN LINE
========================================================= */

.chain-wire {
    position: absolute;

    left: 14px;
    top: 0;

    width: 1px;
    height: 67px;

    background:
        linear-gradient(
            to bottom,
            rgba(210, 207, 195, 0.65),
            rgba(235, 230, 210, 0.85)
        );
}


/* =========================================================
   CHAIN BALL
========================================================= */

.chain-ball {
    position: absolute;

    left: 10px;
    top: 63px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff9df 0%,
            #d8d3c3 45%,
            #9d998e 100%
        );

    box-shadow:
        0 0 3px rgba(255, 225, 140, 0.35);

    transition:
        transform 0.15s ease;
}


/* =========================================================
   CHAIN HOVER
========================================================= */

.pull-chain:hover .chain-ball {
    transform: translateY(3px);
}


/* =========================================================
   CHAIN CLICK
========================================================= */

.pull-chain:active .chain-ball {
    transform: translateY(7px);
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card {
    position: absolute;

    /*
       VIDEO FRAME:
       Card center ≈ 67%
       Lamp center ≈ 29%
    */

    left: 66.8%;
    top: 53.5%;

    width: 180px;
    height: 200px;

    padding:
        29px 24px 22px;

    transform:
        translate(-50%, -50%)
        translateX(35px)
        scale(0.97);

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(37, 38, 39, 0.88),
            rgba(27, 28, 30, 0.84)
        );

    border:
        1px solid rgba(255, 255, 255, 0.025);

    box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.30),
        inset 0 1px rgba(255, 255, 255, 0.025);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    z-index: 20;

    transition:
        opacity 0.65s ease,
        transform 0.7s cubic-bezier(.22, .75, .2, 1),
        visibility 0s linear 0.65s;
}


/* =========================================================
   LOGIN CARD ACTIVE
========================================================= */

body.lamp-on .login-card {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        translateX(0)
        scale(1);

    transition:
        opacity 0.65s ease,
        transform 0.7s cubic-bezier(.22, .75, .2, 1),
        visibility 0s linear 0s;
}


/* =========================================================
   WELCOME
========================================================= */

.login-card h1 {
    margin-bottom: 23px;

    text-align: center;

    color:
        rgba(255, 255, 255, 0.90);

    font-size: 14px;

    line-height: 1;

    font-weight: 500;

    letter-spacing: 0;
}


/* =========================================================
   INPUT WRAPPER
========================================================= */

.input-wrapper {
    margin-bottom: 14px;
}


/* =========================================================
   LABEL
========================================================= */

.input-wrapper label {
    display: block;

    margin-bottom: 5px;

    color:
        rgba(255, 255, 255, 0.32);

    font-size: 7px;

    line-height: 1;

    font-weight: 400;
}


/* =========================================================
   INPUT
========================================================= */

.input-wrapper input {
    display: block;

    width: 100%;
    height: 23px;

    padding:
        0 9px;

    outline: none;

    border:
        1px solid rgba(255, 255, 255, 0.025);

    border-radius: 6px;

    background:
        rgba(255, 255, 255, 0.045);

    color:
        rgba(255, 255, 255, 0.85);

    font-family: Arial, Helvetica, sans-serif;

    font-size: 7px;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}


/* =========================================================
   PLACEHOLDER
========================================================= */

.input-wrapper input::placeholder {
    color:
        rgba(255, 255, 255, 0.18);
}


/* =========================================================
   INPUT FOCUS
========================================================= */

.input-wrapper input:focus {
    background:
        rgba(255, 255, 255, 0.065);

    border-color:
        rgba(220, 205, 135, 0.28);

    box-shadow:
        0 0 0 2px
        rgba(220, 205, 135, 0.025);
}


/* =========================================================
   SIGN IN BUTTON
========================================================= */

.signin-button {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 26px;

    margin-top: 3px;

    padding: 0;

    border: none;

    border-radius: 7px;

    outline: none;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            105deg,
            #c6b467 0%,
            #eee3a1 50%,
            #c3b062 100%
        );

    color:
        #3b351f;

    font-size: 7px;

    font-weight: 600;

    box-shadow:
        0 3px 10px
        rgba(225, 202, 112, 0.10);

    transition:
        transform 0.18s ease,
        filter 0.18s ease,
        box-shadow 0.18s ease;
}


/* =========================================================
   BUTTON SHINE
========================================================= */

.signin-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.58),
            transparent
        );

    transform: skewX(-22deg);

    transition:
        left 0.6s ease;
}


/* =========================================================
   BUTTON HOVER
========================================================= */

.signin-button:hover {
    filter: brightness(1.05);

    transform:
        translateY(-1px);

    box-shadow:
        0 5px 14px
        rgba(225, 202, 112, 0.18);
}


.signin-button:hover::before {
    left: 150%;
}


/* =========================================================
   BUTTON CLICK
========================================================= */

.signin-button:active {
    transform: scale(0.97);
}


/* =========================================================
   STATUS MESSAGE
========================================================= */

.status-message {
    min-height: 12px;

    margin-top: 9px;

    text-align: center;

    color:
        rgba(255, 255, 255, 0.45);

    font-size: 7px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .lamp-container {
        left: 29%;
        top: 53%;
    }

    .login-card {
        left: 67%;
        top: 53%;
    }
}


@media (max-width: 550px) {

    .lamp-container {
        left: 27%;
    }

    .login-card {
        left: 69%;
    }
}


@media (max-width: 430px) {

    .lamp-container {
        left: 25%;
        transform:
            translate(-50%, -50%)
            scale(0.85);
    }

    .login-card {
        left: 70%;

        width: 165px;
        height: 185px;

        transform:
            translate(-50%, -50%)
            translateX(30px)
            scale(.88);
    }

    body.lamp-on .login-card {
        transform:
            translate(-50%, -50%)
            scale(.88);
    }
}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-width: 350px) {

    .lamp-container {
        left: 22%;
        transform:
            translate(-50%, -50%)
            scale(.72);
    }

    .login-card {
        left: 71%;

        width: 145px;
        height: 170px;

        padding: 23px 18px;
    }
}
</style>
</head>

<body>

    <div class="scene">

        <!-- =================================
             LIGHT / AMBIENT GLOW
        ================================== -->

        <div class="ambient-light"></div>


        <!-- =================================
             LAMP
        ================================== -->

        <div class="lamp-container">

            <div class="lamp">

                <!-- Lamp shade -->
                <div class="lamp-shade">
                    <div class="shade-highlight"></div>
                </div>

                <!-- Lamp stem -->
                <div class="lamp-stem"></div>

                <!-- Lamp bottom -->
                <div class="lamp-base"></div>

            </div>


            <!-- Pull chain -->
            <button
                class="pull-chain"
                id="pullChain"
                aria-label="Turn lamp on or off"
            >

                <span class="chain-wire"></span>

                <span class="chain-ball"></span>

            </button>

        </div>


        <!-- =================================
             LOGIN CARD
        ================================== -->

        <div class="login-card" id="loginCard">

            <h1>Welcome</h1>


            <form id="loginForm">

                <!-- Username -->

                <div class="input-wrapper">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="off"
                    >

                </div>


                <!-- Password -->

                <div class="input-wrapper">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                    >

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="signin-button"
                    id="signinButton"
                >
                    <span>Sign In</span>
                </button>

            </form>


            <p
                class="status-message"
                id="statusMessage"
            ></p>

        </div>

    </div>


    <script>
        const body = document.body;

const pullChain =
    document.getElementById("pullChain");

const loginForm =
    document.getElementById("loginForm");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const signinButton =
    document.getElementById("signinButton");

const statusMessage =
    document.getElementById("statusMessage");

const loginCard =
    document.getElementById("loginCard");


/* =========================================
   INITIAL STATE
========================================= */

let lampIsOn = false;


/* =========================================
   LAMP ON / OFF
========================================= */

function toggleLamp() {

    lampIsOn = !lampIsOn;

    body.classList.toggle(
        "lamp-on",
        lampIsOn
    );


    /* Clear message when lamp turns off */

    if (!lampIsOn) {

        statusMessage.textContent = "";

    }

}


/* =========================================
   PULL CHAIN CLICK
========================================= */

pullChain.addEventListener(
    "click",
    toggleLamp
);


/* =========================================
   KEYBOARD SUPPORT
========================================= */

pullChain.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            toggleLamp();

        }

    }
);


/* =========================================
   LOGIN FORM
========================================= */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const user =
            username.value.trim();

        const pass =
            password.value.trim();


        /* Validation */

        if (!user || !pass) {

            statusMessage.textContent =
                "Please fill all fields.";

            statusMessage.style.color =
                "rgba(255,150,150,.85)";

            return;

        }


        /* Loading */

        signinButton.disabled = true;

        signinButton.querySelector(
            "span"
        ).textContent = "Signing in...";


        statusMessage.textContent = "";


        /* Simulated real login */

        setTimeout(function() {

            signinButton.disabled = false;

            signinButton.querySelector(
                "span"
            ).textContent = "Sign In";


            statusMessage.textContent =
                "Login successful!";

            statusMessage.style.color =
                "rgba(255,231,145,.9)";


            loginCard.classList.add(
                "success"
            );


        }, 900);

    }
);


/* =========================================
   INPUT TYPING EFFECT
========================================= */

username.addEventListener(
    "input",
    function() {

        if (this.value.length > 0) {

            this.style.borderColor =
                "rgba(255,220,130,.25)";

        } else {

            this.style.borderColor =
                "rgba(255,255,255,.055)";

        }

    }
);


/* =========================================
   MOUSE PARALLAX
========================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            event.clientX /
            window.innerWidth -
            0.5;

        const y =
            event.clientY /
            window.innerHeight -
            0.5;


        const lamp =
            document.querySelector(
                ".lamp-container"
            );

        if (!lampIsOn) {

            lamp.style.marginLeft =
                `${x * 2}px`;

            lamp.style.marginTop =
                `${y * 2}px`;

        }

    }
);
    </script>

</body>
</html>
